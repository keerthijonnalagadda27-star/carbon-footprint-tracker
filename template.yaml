AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cloud-Based Personal Carbon Footprint Tracker (CSE2025 DA01)

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to the SNS alert topic (leave blank to skip).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:
  CarbonApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  ActivitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: activityKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: activityKey
          KeyType: RANGE

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Carbon footprint threshold alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      TopicArn: !Ref AlertTopic
      Endpoint: !Ref AlertEmail

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "carbon-tracker-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  CarbonFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: backend/
      Description: Calculate CO2, persist activities, and publish SNS alerts
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          ACTIVITIES_TABLE: !Ref ActivitiesTable
          SNS_TOPIC_ARN: !Ref AlertTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ActivitiesTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
      Events:
        ProxyAny:
          Type: Api
          Properties:
            RestApiId: !Ref CarbonApi
            Path: /{proxy+}
            Method: ANY
        RootAny:
          Type: Api
          Properties:
            RestApiId: !Ref CarbonApi
            Path: /
            Method: ANY

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: carbon-tracker-lambda-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CarbonFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: API Gateway invoke URL
    Value: !Sub "https://${CarbonApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  WebsiteURL:
    Description: S3 website URL for the frontend
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Description: Frontend S3 bucket
    Value: !Ref FrontendBucket
  SnsTopicArn:
    Description: SNS topic for threshold emails
    Value: !Ref AlertTopic
